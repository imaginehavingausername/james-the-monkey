<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>James the Monkey</title>
<link rel="icon" type="image/webp" href="bigjamesnobg.png" />
<meta name="description" content="A new chapter in James's story, every day." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Work+Sans:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a href="#" class="wordmark" id="home-link" aria-label="Back to today">
        <img src="bigjamesnobg.png" alt="" class="mark" width: 46px; height: 46px;" />
        <span class="wordmark-text">James</span>
      </a>
      <div class="day-counter" id="day-counter" aria-live="polite"></div>
    </header>

    <main id="main" aria-live="polite">
      <div class="state state-loading" id="state-loading">
        <p>Finding today's page&hellip;</p>
      </div>
    </main>

    <nav class="story-nav" id="story-nav" aria-label="Story navigation" hidden>
      <button id="prev-btn" class="nav-arrow" type="button" aria-label="Previous entry">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>

      <div class="nav-center">
        <select id="jump-select" aria-label="Jump to an entry"></select>
        <button id="today-btn" class="today-pill" type="button" hidden>Today</button>
        <button id="share-btn" class="nav-arrow" type="button" aria-label="Share this entry" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 502.58 476.6" aria-hidden="true" focusable="false" width="28" height="28" style="display: block; stroke: #000; stroke-width: 40px; stroke-miterlimit: 133.33; fill: none; stroke-linecap: round; stroke-linejoin: round; transform: translateY(1px);">
            <path d="M171.47,225.83l40.24,204.52c7.6,38.61,59.48,46.3,77.94,11.54L485.14,73.92c7.56-14.24,5.98-29.97-1.58-41.95M171.47,225.83L25.31,84.34C-1.68,58.21,16.82,12.5,54.39,12.5h393.82c15.41,0,28.11,8.02,35.34,19.47M171.47,225.83L483.56,31.97M486.28,30.28l-2.73,1.69"/>
          </svg>
          <span id="share-tooltip" style="position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); background: var(--text, #333); color: var(--bg, #fff); padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.2s ease; z-index: 10;">Share link copied to clipboard</span>
        </button>
      </div>

      <button id="next-btn" class="nav-arrow" type="button" aria-label="Next entry">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
