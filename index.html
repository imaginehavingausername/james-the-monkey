<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>James</title>
<meta name="description" content="A new chapter in James's story, every day." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a href="#" class="wordmark" id="home-link" aria-label="Back to today">
        <svg viewBox="0 0 32 32" class="mark" aria-hidden="true">
          <path
            d="M16 4c-4.5 0-8 3.6-8 8 0 2 .7 3.8 1.9 5.2C8.7 18.4 8 20 8 21.8 8 25.8 11.8 28 16 28s8-2.2 8-6.2c0-1.8-.7-3.4-1.9-4.6C23.3 15.8 24 14 24 12c0-4.4-3.5-8-8-8Z"
          />
          <circle cx="12.5" cy="13" r="1.4" class="mark-eye" />
          <circle cx="19.5" cy="13" r="1.4" class="mark-eye" />
        </svg>
        <span class="wordmark-text">James</span>
      </a>
      <div class="day-counter" id="day-counter" aria-live="polite"></div>
    </header>

    <main id="main" aria-live="polite">
      <div class="state state-loading" id="state-loading">
        <p>Finding today's page&hellip;</p>
      </div>
    </main>

    <nav class="story-nav" id="story-nav" aria-label="Story navigation" hidden>
      <button id="prev-btn" class="nav-arrow" type="button" aria-label="Previous entry">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>

      <div class="nav-center">
        <select id="jump-select" aria-label="Jump to an entry"></select>
        <button id="today-btn" class="today-pill" type="button" hidden>Today</button>
      </div>

      <button id="next-btn" class="nav-arrow" type="button" aria-label="Next entry">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
