<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>James the Monkey Health</title>
</head>
<body>
  <pre id="result"></pre>
  <script>
    (async () => {
      const result = document.getElementById("result");
      try {
        // Match the main page's cache busting so new days appear immediately.
        const response = await fetch(`../days/index.json?_=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const index = await response.json();
        if (!Array.isArray(index)) throw new Error("Invalid archive index");
        result.textContent = JSON.stringify({ days: index.length, status: "ok" });
      } catch (error) {
        result.textContent = JSON.stringify({ days: null, status: "error" });
      }
    })();
  </script>
</body>
</html>
